name: FG HTTP Diagnostic

on:
  push:
    paths:
      - ".github/run/fg-debug-trigger.txt"
  pull_request:
    paths:
      - ".github/run/fg-debug-trigger.txt"
      - ".github/workflows/fg-debug.yml"

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe Farmacias Guadalajara
        shell: bash
        run: |
          mkdir -p diagnostics
          SAFE_OS=$(echo '${{ matrix.os }}' | tr -cd '[:alnum:]_-')
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36'
          probe() {
            NAME="$1"
            EXTRA="$2"
            set +e
            curl $EXTRA -L \
              --connect-timeout 8 --max-time 20 \
              -A "$UA" \
              -D "diagnostics/${SAFE_OS}_${NAME}_headers.txt" \
              -o "diagnostics/${SAFE_OS}_${NAME}_body.txt" \
              -w 'http_code=%{http_code}\nremote_ip=%{remote_ip}\nsize_download=%{size_download}\ntime_total=%{time_total}\n' \
              'https://www.farmaciasguadalajara.com/farmacia/salud-sexual/preservativos' \
              > "diagnostics/${SAFE_OS}_${NAME}_meta.txt" \
              2> "diagnostics/${SAFE_OS}_${NAME}_stderr.txt"
            echo "curl_exit=$?" >> "diagnostics/${SAFE_OS}_${NAME}_meta.txt"
          }
          probe default '' &
          probe http1 '--http1.1' &
          wait || true
          for meta in diagnostics/*_meta.txt; do
            echo "===== $meta ====="
            cat "$meta"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fg-http-${{ matrix.os }}-${{ github.run_number }}
          path: diagnostics/
          retention-days: 2
          if-no-files-found: warn
