name: Full Scraper - Hosted Session

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/run/hosted-session-trigger.txt"

permissions:
  contents: read

jobs:
  scrape-all:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Restore Walmart session from GitHub Secret
        shell: bash
        env:
          WALMART_SESSION_GZIP_B64: ${{ secrets.WALMART_SESSION_GZIP_B64 }}
        run: |
          if [[ -z "$WALMART_SESSION_GZIP_B64" ]]; then
            echo "Falta el secret WALMART_SESSION_GZIP_B64."
            echo "Ejecuta scripts/export_walmart_session.py localmente y guarda walmart_session.secret.txt como Repository Secret."
            exit 1
          fi
          AUTH_FILE="$RUNNER_TEMP/walmart_session.json"
          printf '%s' "$WALMART_SESSION_GZIP_B64" | base64 --decode | gzip --decompress > "$AUTH_FILE"
          chmod 600 "$AUTH_FILE"
          echo "WALMART_STORAGE_STATE_FILE=$AUTH_FILE" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: pytest -q

      - name: Run all retailers and categories
        run: |
          python scripts/run_all_retailers.py \
            --walmart-storage-state "$WALMART_STORAGE_STATE_FILE"

      - name: Upload consolidated workbook and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concentrado-scraper-${{ github.run_number }}
          path: |
            output/concentrado_scraper.xlsx
            diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Delete reconstructed session
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/walmart_session.json"
