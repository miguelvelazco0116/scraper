name: Full Retailer Test

on:
  pull_request:
    paths:
      - ".github/run/full-test-trigger.txt"
      - ".github/workflows/soriana.yml"

permissions:
  contents: read

jobs:
  full-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Install Chromium
        run: playwright install chromium

      - name: Run all configured retailer cases
        shell: bash
        run: |
          set -u
          mkdir -p full_test_logs full_test_diagnostics
          printf "retailer\tcategory\tlocation\texit_code\tresult\tproducts\n" > full_test_summary.tsv

          run_case() {
            retailer="$1"
            category="$2"
            location="$3"
            slug="${retailer}_${category}_${location}"
            log="full_test_logs/${slug}.log"

            echo "============================================================"
            echo "TEST: retailer=$retailer category=$category location=$location"
            echo "============================================================"

            set +e
            if [[ "$retailer" == "walmart" ]]; then
              python main.py --retailer walmart --category "$category" --store "$location" --max-load-more 100 2>&1 | tee "$log"
              rc=${PIPESTATUS[0]}
            else
              python main.py --retailer soriana --category "$category" --location "$location" --max-load-more 100 2>&1 | tee "$log"
              rc=${PIPESTATUS[0]}
            fi
            set -e

            products=$(grep -Eo 'Productos únicos: [0-9]+' "$log" | tail -1 | awk '{print $3}' || true)
            products=${products:-0}

            if [[ $rc -eq 0 ]]; then
              result="success"
            elif grep -qi 'BLOCKED:' "$log"; then
              result="blocked"
            elif grep -qi 'STORE_CONTEXT_ERROR:' "$log"; then
              result="store_context_error"
            else
              result="error"
            fi

            printf "%s\t%s\t%s\t%s\t%s\t%s\n" "$retailer" "$category" "$location" "$rc" "$result" "$products" >> full_test_summary.tsv

            mkdir -p "full_test_diagnostics/${slug}"
            if [[ -d diagnostics ]]; then
              cp -a diagnostics/. "full_test_diagnostics/${slug}/" 2>/dev/null || true
              rm -rf diagnostics
              mkdir -p diagnostics
            fi
          }

          run_case soriana cuidado-bucal cdmx
          run_case soriana limpiadores cdmx
          run_case soriana detergentes cdmx
          run_case walmart cuidado-bucal sc-toreo
          run_case walmart cuidado-de-la-ropa sc-toreo

          echo ""
          echo "================ SUMMARY ================"
          cat full_test_summary.tsv

      - name: Analyze generated Excel files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          rows = []
          for path in sorted(Path('output').glob('*.xlsx')):
              df = pd.read_excel(path)
              def present(col):
                  return int(df[col].notna().sum()) if col in df.columns else 0
              dup = int(df['sku'].duplicated().sum()) if 'sku' in df.columns else 0
              rows.append({
                  'file': path.name,
                  'rows': len(df),
                  'sku_present': present('sku'),
                  'price_current_present': present('price_current'),
                  'price_regular_present': present('price_regular'),
                  'url_present': present('url'),
                  'duplicate_sku': dup,
                  'store_context_verified_true': int(df['store_context_verified'].fillna(False).astype(bool).sum()) if 'store_context_verified' in df.columns else 0,
              })
          metrics = pd.DataFrame(rows)
          metrics.to_csv('full_test_metrics.csv', index=False)
          print(metrics.to_string(index=False) if not metrics.empty else 'No Excel files generated')
          PY

      - name: Upload complete test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-retailer-test-${{ github.run_number }}
          path: |
            output/
            full_test_logs/
            full_test_diagnostics/
            full_test_summary.tsv
            full_test_metrics.csv
          if-no-files-found: warn
          retention-days: 14
