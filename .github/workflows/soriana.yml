name: Retailer Scraper

on:
  workflow_dispatch:
    inputs:
      retailer:
        description: Retailer
        required: true
        default: soriana
        type: choice
        options:
          - soriana
          - walmart
      category:
        description: Categoria configurada
        required: true
        default: cuidado-bucal
        type: string
      location:
        description: Ubicacion o tienda configurada
        required: true
        default: cdmx
        type: string
  push:
    paths:
      - ".github/run/soriana-trigger.txt"
      - ".github/run/walmart-trigger.txt"
  pull_request:
    paths:
      - ".github/run/soriana-trigger.txt"
      - ".github/run/walmart-trigger.txt"
      - "config/**"
      - "scraper/config.py"
      - "scraper/parsers.py"
      - "scraper/retailers/**"
      - "main.py"
      - "tests/**"
      - ".github/workflows/soriana.yml"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve parameters
        id: params
        shell: bash
        run: |
          RETAILER="${{ inputs.retailer }}"
          CATEGORY="${{ inputs.category }}"
          LOCATION="${{ inputs.location }}"

          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            if [[ -f ".github/run/walmart-trigger.txt" ]] && grep -q '^retailer=walmart' .github/run/walmart-trigger.txt; then
              FILE_RETAILER=$(grep -E '^retailer=' .github/run/walmart-trigger.txt | tail -1 | cut -d= -f2- || true)
              FILE_CATEGORY=$(grep -E '^category=' .github/run/walmart-trigger.txt | tail -1 | cut -d= -f2- || true)
              FILE_LOCATION=$(grep -E '^store=' .github/run/walmart-trigger.txt | tail -1 | cut -d= -f2- || true)
              RETAILER="${FILE_RETAILER:-$RETAILER}"
              CATEGORY="${FILE_CATEGORY:-$CATEGORY}"
              LOCATION="${FILE_LOCATION:-$LOCATION}"
            elif [[ -f ".github/run/soriana-trigger.txt" ]]; then
              FILE_RETAILER=$(grep -E '^retailer=' .github/run/soriana-trigger.txt | tail -1 | cut -d= -f2- || true)
              FILE_CATEGORY=$(grep -E '^category=' .github/run/soriana-trigger.txt | tail -1 | cut -d= -f2- || true)
              FILE_LOCATION=$(grep -E '^location=' .github/run/soriana-trigger.txt | tail -1 | cut -d= -f2- || true)
              RETAILER="${FILE_RETAILER:-soriana}"
              CATEGORY="${FILE_CATEGORY:-$CATEGORY}"
              LOCATION="${FILE_LOCATION:-$LOCATION}"
            fi
          fi

          RETAILER="${RETAILER:-soriana}"
          CATEGORY="${CATEGORY:-cuidado-bucal}"
          if [[ "$RETAILER" == "walmart" ]]; then
            LOCATION="${LOCATION:-sc-toreo}"
          else
            LOCATION="${LOCATION:-cdmx}"
          fi
          echo "retailer=$RETAILER" >> "$GITHUB_OUTPUT"
          echo "category=$CATEGORY" >> "$GITHUB_OUTPUT"
          echo "location=$LOCATION" >> "$GITHUB_OUTPUT"
          echo "Ejecutando retailer=$RETAILER category=$CATEGORY location=$LOCATION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Install Chromium
        run: playwright install chromium

      - name: Run scraper
        id: scrape
        continue-on-error: true
        shell: bash
        run: |
          if [[ "${{ steps.params.outputs.retailer }}" == "walmart" ]]; then
            python main.py --retailer walmart --category "${{ steps.params.outputs.category }}" --store "${{ steps.params.outputs.location }}"
          else
            python main.py --retailer soriana --category "${{ steps.params.outputs.category }}" --location "${{ steps.params.outputs.location }}"
          fi

      - name: Upload Excel and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.params.outputs.retailer }}-${{ steps.params.outputs.category }}-${{ steps.params.outputs.location }}-${{ github.run_number }}
          path: |
            output/
            diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow if scraper failed
        if: steps.scrape.outcome == 'failure'
        run: exit 1
