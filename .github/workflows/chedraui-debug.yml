name: Chedraui API Capture

on:
  push:
    paths:
      - ".github/run/chedraui-debug-trigger.txt"
      - "scripts/debug_chedraui_graphql.py"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install chromium
      - run: python scripts/debug_chedraui_graphql.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chedraui-api-capture-${{ github.run_number }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 2
