name: San Pablo Probe

on:
  pull_request:
    paths:
      - "scripts/probe_san_pablo.py"
      - ".github/workflows/san-pablo-probe.yml"
      - "config/farmacias-san-pablo/**"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install chromium
      - run: python scripts/probe_san_pablo.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: san-pablo-probe-${{ github.run_number }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
